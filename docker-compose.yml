version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./BackEnd
    container_name: backend-app
    restart: always
    env_file: ./BackEnd/.env
    depends_on:
      - postgres
    ports:
      - "4000:4000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: secret
      DB_NAME: mydb
  
  frontend:
    build: ./FrontEnd
    container_name: frontend-app
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
